<style>
  @font-face { font-family:'Wantedo'; src:url('assets/fonts/Wantedo.ttf') format('truetype'); font-display:swap; }
  :root { --gold:#ffffff; --cream:#f3eedd; --ink:#1b120a; --wood:#5a3a22; }   /* UI chrome is white now (no yellow) — owner: menu/UI text black or white only */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; width:100%; overflow:hidden; background:#120c07; font-family:Georgia,serif; color:var(--cream); touch-action:none; user-select:none; }
  #wrap { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { pointer-events:none; z-index:10; }
  /* cinematic FX overlay — real bokeh/dust/film footage screen-blended over the render (black footage → transparent, only the light/particles show through) */
  #fxOverlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:5; pointer-events:none; mix-blend-mode:screen; opacity:0; transition:opacity .6s ease; display:none; }
  /* HUD plates removed — type sits straight on the world with a soft shadow, no boxes */
  .glass { display:none; }
  /* camera dock (right edge) */
  #cam { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:20; }
  #cam button {
    width:44px; height:44px; border:none; outline:none; border-radius:0; cursor:pointer;
    background:transparent; color:var(--gold); font:900 24px Wantedo,Georgia;
    display:flex; align-items:center; justify-content:center;
  }
  #cam button:focus, #snd button:focus, #cam button:focus-visible, #snd button:focus-visible { outline:none; box-shadow:none; }
  #cam button:active { transform:translateY(2px); color:#fff; }
  /* sound dock (bottom-right) */
  #snd { position:absolute; right:14px; bottom:14px; display:flex; gap:8px; z-index:20; }
  #snd button { width:44px; height:44px; border:none; outline:none; border-radius:0; cursor:pointer;
    background:transparent; color:var(--gold); font:900 15px Wantedo,Georgia; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; }
  #load { position:absolute; inset:0; z-index:60; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#160f08; transition:opacity .4s; }
  #load.gone { opacity:0; pointer-events:none; }
  #load h1 { font-family:Wantedo,Georgia; color:var(--gold); font-size:8vmin; letter-spacing:1px; }
  #load p { color:#f3eedd; font-size:3vmin; font-family:Wantedo,Georgia; }
  .spin { width:40px; height:40px; border-radius:50%; border:5px solid #3a2616; border-top-color:var(--gold); animation:s .9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  /* phones: bigger touch targets, docks tucked tighter */
  @media (max-width:720px) {
    #cam { right:4px; gap:14px; }
    #cam button { width:48px; height:48px; font-size:26px; }
    #snd { right:4px; bottom:10px; }
    #snd button { width:48px; height:48px; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="scene"></canvas>
    <div id="glassTL" class="glass"></div>
    <div id="glassTR" class="glass"></div>
    <div id="glassPM" class="glass"></div>
    <video id="fxOverlay" muted loop playsinline autoplay preload="auto"></video>
    <canvas id="hud"></canvas>
    <div id="cam">
      <button id="rotL" title="Rotate left">&#8634;</button>
      <button id="rotR" title="Rotate right">&#8635;</button>
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
      <button id="vreset" title="Reset view">&#9678;</button>
    </div>
    <div id="snd">
      <button id="mute" title="Audio & volume">SND</button>
    </div>
    <div id="load">
      <h1>GUNSLINGERS</h1>
      <p>PINBALL&nbsp;GOLF</p>
      <div class="spin"></div>
    </div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/gifquick.js?v=2"></script>
  <script src="js/net.js?v=15"></script>
  <script src="js/pingolf.js?v=350"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
